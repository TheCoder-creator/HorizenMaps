<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://*.openstreetmap.org https://cdnjs.cloudflare.com; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://*.openstreetmap.org https://router.project-osrm.org https://nominatim.openstreetmap.org https://overpass-api.de; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(), microphone=()">
<title>HorizonMaps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-rotate@0.6.2/dist/leaflet-rotate.css">
<style>
:root{--bg:#fff;--panel:#fff;--text:#17191d;--muted:#68717d;--border:#e1e5eb;--blue:#2878f0;--shadow:0 5px 24px #0002}
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:var(--text)}body{overflow:hidden}#map{position:absolute;inset:0;z-index:0;background:#e9eef3}
.panel,.card,.sheet{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
#searchPanel{position:absolute;z-index:5;top:12px;left:12px;width:320px;max-width:calc(100vw - 24px);padding:13px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.header strong{font-size:17px}.header small{font-size:9px;letter-spacing:1px;color:var(--muted)}
label{display:block;margin:8px 0 4px;color:var(--muted);font-size:11px}
input{width:100%;min-width:0;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-size:14px;outline:none}input:focus{border-color:var(--blue)}
.row{display:flex;gap:6px}.btn{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font-weight:650;font-size:12px;cursor:pointer}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.active{background:#eaf2ff;border-color:#9bc1ff;color:#1458bb}.btn.danger{color:#c52d2d}.btn:disabled{opacity:.5;cursor:default}
#routeBtn{width:100%;margin-top:9px;padding:12px;font-size:14px}
.field{position:relative}.suggestions{display:none;position:absolute;z-index:20;top:100%;left:0;right:0;max-height:210px;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow)}.suggestions.show{display:block}.suggestion{padding:10px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}.suggestion:hover{background:#eff6ff}
#status{min-height:16px;margin-top:8px;color:var(--muted);font-size:11px;line-height:1.4}#status.error{color:#c52d2d}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.quick .btn{padding:8px 3px}
#collapseBtn{padding:5px 9px}
#navInfo{display:none;position:absolute;z-index:4;top:12px;left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 360px));gap:7px;pointer-events:none}
.navCard{flex:1;min-width:0;padding:8px 4px;text-align:center}.navLabel{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.6px}.navValue{margin-top:3px;font-size:16px;font-weight:800;white-space:nowrap}
#nextTurn{display:none;position:absolute;z-index:6;top:12px;left:12px;transform:none;width:min(320px,calc(100vw - 24px));padding:12px;pointer-events:none}
.turn{display:flex;align-items:center;gap:12px}.turnIcon{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:var(--blue);color:#fff;font-size:26px}.turnDistance{font-size:21px;font-weight:800}.turnType{font-size:13px;color:var(--muted);margin-top:2px}.turnRoad{font-size:11px;color:var(--muted);margin-top:7px}
#speedBox,#limitBox{position:absolute;z-index:4;bottom:16px;min-width:92px;padding:8px 12px;text-align:center}#speedBox{left:14px}#limitBox{left:120px}#speedValue,#limitValue{font-size:23px;font-weight:800}#speedUnit,#limitUnit{font-size:10px;color:var(--muted)}
#mapControls{position:absolute;z-index:4;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}#mapControls .btn{width:42px;height:40px;padding:0;font-size:17px}
#bottomBar{position:absolute;z-index:4;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 130px)}#bottomBar .btn{box-shadow:var(--shadow)}
.sheet{display:none;position:absolute;z-index:8;right:12px;top:12px;width:320px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;padding:13px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheetHead strong{font-size:15px}
.step,.placeItem,.historyItem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.4}.stepIcon{width:25px;text-align:center;font-size:18px}.muted{color:var(--muted)}
.routeChoice{margin-top:7px;padding:9px;border:1px solid var(--border);border-radius:9px;font-size:12px;cursor:pointer}.routeChoice.selected{border-color:var(--blue);background:#eff6ff}
.carMarker{width:34px;height:44px;position:relative;filter:drop-shadow(0 2px 3px #0007)}.carRotate{position:absolute;inset:0;transform-origin:50% 50%}
.leaflet-marker-icon{background:transparent;border:0}.leaflet-tile-pane.dark-tiles .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.9)}.carBody{position:absolute;left:6px;top:9px;width:22px;height:29px;border:2px solid white;border-radius:8px 8px 6px 6px;background:#2878f0}.carGlass{position:absolute;left:11px;top:13px;width:12px;height:8px;background:#bfe2ff;border-radius:4px 4px 2px 2px}.carNose{position:absolute;top:0;left:13px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:10px solid #2878f0}.carLight{position:absolute;left:8px;top:33px;width:4px;height:3px;background:white;box-shadow:14px 0 white}
@media(max-width:700px){
 #searchPanel{top:9px;left:9px;width:calc(100vw - 18px);padding:10px}
 #searchPanel.collapsed .searchFields,#searchPanel.collapsed .quick{display:none}
 #navInfo{top:auto;bottom:70px;width:calc(100vw - 20px)}
 #nextTurn{top:9px;left:9px;width:calc(100vw - 18px);max-width:420px}
 #mapControls{top:auto;right:9px;bottom:70px}
 #mapControls .btn{width:38px;height:36px}
 #bottomBar{left:9px;right:55px;bottom:9px;justify-content:flex-start}
 #bottomBar .btn{padding:8px}
 #speedBox{bottom:135px;left:9px} #limitBox{bottom:135px;left:112px}
 #directions,#places,#history,#routeOptions{top:9px;right:9px;max-height:calc(100vh - 18px)}
 #directionsCancel{top:9px;left:9px}
}
</style>
</head>
<body>
<div id="map"></div>
<button class="btn" id="directionsCancel" style="display:none;position:absolute;z-index:9;top:12px;left:12px">✕ Cancel</button>

<section id="searchPanel" class="panel">
 <div class="header"><div><strong>HorizonMaps</strong><br><small>EXPLORE · NAVIGATE</small></div><button class="btn" id="collapseBtn">−</button></div>
 <div class="searchFields">
  <label>Starting point</label>
  <div class="field"><div class="row"><input id="origin" placeholder="My current location" autocomplete="off"><button class="btn" id="gpsBtn" title="Use my location">📍</button></div><div id="originSuggest" class="suggestions"></div></div>
  <label>Destination</label>
  <div class="field"><input id="dest" placeholder="Where do you want to go?" autocomplete="off"><div id="destSuggest" class="suggestions"></div></div>
  <button class="btn primary" id="routeBtn">Find route</button>
  <div id="status">Enter a destination to get started.</div>
 </div>
 <div class="quick"><button class="btn" id="saveBtn">☆ Save</button><button class="btn" id="savedBtn">★ Saved</button><button class="btn" id="historyBtn">◷ History</button></div>
 
</section>

<div id="navInfo">
 <div class="navCard card"><div class="navLabel">Arrival</div><div class="navValue" id="etaValue">--</div></div>
 <div class="navCard card"><div class="navLabel">Time left</div><div class="navValue" id="timeValue">--</div></div>
 <div class="navCard card"><div class="navLabel">Distance</div><div class="navValue" id="distanceValue">--</div></div>
</div>
<div id="nextTurn" class="card"><div class="turn"><div class="turnIcon" id="turnIcon">↑</div><div><div class="turnDistance" id="turnDistance">--</div><div class="turnType" id="turnType">Continue straight</div></div></div><div class="turnRoad" id="turnRoad"></div></div>
<div id="speedBox" class="card"><div id="speedValue">--</div><div id="speedUnit">mph · GPS speed</div></div>\n<div id="limitBox" class="card"><div id="limitValue">--</div><div id="limitUnit">mph · speed limit</div></div>

<div id="mapControls">
 <button class="btn" id="recenterBtn" title="Recenter">◎</button>
 <button class="btn" id="compassBtn" title="Toggle heading-up">🧭</button>
  <button class="btn" id="themeBtn" title="Toggle map theme">☾</button>
 <button class="btn" id="zoomInBtn" title="Zoom in">＋</button>
 <button class="btn" id="zoomOutBtn" title="Zoom out">−</button>
</div>
<div id="bottomBar">
 <button class="btn" id="routesBtn">↗ Routes</button>
 <button class="btn" id="directionsBtn">☷ Directions</button>
 <button class="btn" id="nearbyBtn">⌕ Nearby</button>
 <button class="btn" id="voiceBtn">🔊 Voice on</button>
 <button class="btn" id="trafficBtn">🚦 Traffic</button>
 <button class="btn danger" id="stopBtn" style="display:none">■ Stop</button>
</div>

<div id="routeOptions" class="sheet"><div class="sheetHead"><strong>Choose a route</strong><button class="btn" data-close="routeOptions">✕</button></div><div id="routeChoices"></div></div>
<div id="directions" class="sheet"><div class="sheetHead"><strong>Turn-by-turn directions</strong><button class="btn" data-close="directions">✕</button></div><div id="directionsContent" class="muted">Plan a route to see directions.</div></div>
<div id="places" class="sheet"><div class="sheetHead"><strong>Places</strong><button class="btn" data-close="places">✕</button></div><div id="placesContent" class="muted">Nearby places will appear here.</div></div>
<div id="history" class="sheet"><div class="sheetHead"><strong>Route history</strong><button class="btn" data-close="history">✕</button></div><div id="historyContent"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.6.2/dist/leaflet-rotate.js"></script>
<script>
const $=id=>document.getElementById(id);
const ROUTER="https://router.project-osrm.org";
const GEOCODER="https://nominatim.openstreetmap.org/search";
const OVERPASS="https://overpass-api.de/api/interpreter";
const S={
 gps:null,accuracy:999,speed:null,heading:0,watch:null,lastFix:null,lastFixAt:0,
 marker:null,target:null,display:null,predictionAt:0,
 route:null,routes:[],routeIndex:0,steps:[],stepIndex:0,coords:[],progress:0,
 origin:null,destination:null,live:false,following:false,headingUp:true,dark:false,
 rerouting:false,lastReroute:0,offRouteSince:0,voice:true,spokenStep:-1,frame:0,history:[],saved:[],routeMode:"fastest",lastLimitQuery:0,limitController:null,
 searchControllers:{},searchSequence:{},routeLine:null,alternativeLines:[],completedLine:null,
 destinationMarker:null
};

const map=L.map("map",{
  rotate:true,
  bearing:0,
  zoomControl:false,
  attributionControl:true,
  preferCanvas:true
}).setView([37.3382,-121.8863],12);

const streetLayer=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
});
streetLayer.addTo(map);
streetLayer.on("tileerror",()=>{
 if(!S.tileErrorShown){S.tileErrorShown=true;status("Map tiles are not loading. Check the connection or map security settings.",true)}
});
streetLayer.on("tileload",()=>{
 S.tileErrorShown=false;
 if($("status").textContent.startsWith("Map tiles are not loading"))status("Map loaded.");
});

function status(t,error=false){$("status").textContent=t;$("status").className=error?"error":""}
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function dist(a,b){const R=6371000,p1=rad(a[0]),p2=rad(b[0]),dp=rad(b[0]-a[0]),dl=rad(b[1]-a[1]);const q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function bearing(a,b){const p1=rad(a[0]),p2=rad(b[0]),dl=rad(b[1]-a[1]);return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}
function wrap(x){return (x%360+360)%360}
function angleDelta(a,b){return (b-a+540)%360-180}
function smoothAngle(a,b,f=.2){return wrap(a+angleDelta(a,b)*f)}
function predictPoint(p,h,m){const R=6371000,d=m/R,t=rad(h),p1=rad(p[0]),l1=rad(p[1]);const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(t));const l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return [deg(p2),((deg(l2)+540)%360)-180]}
function distText(m){if(m<1000)return Math.round(m*3.28084/10)*10+" ft";const mi=m/1609.344;return mi.toFixed(mi<10?1:0)+" mi"}
function timeText(s){const m=Math.max(0,Math.round(s/60));return m>=60?Math.floor(m/60)+" hr "+m%60+" min":m+" min"}
function routePoint(p){return L.latLng(p[0],p[1])}
function clearLines(){
 [S.routeLine,S.completedLine,...S.alternativeLines].forEach(x=>{if(x)map.removeLayer(x)});
 S.routeLine=null;S.completedLine=null;S.alternativeLines=[];
}
function updateProgress(){
 if(!S.gps||!S.coords.length)return;
 let best=S.progress,bestD=Infinity;
 const end=Math.min(S.coords.length-1,S.progress+300);
 for(let i=Math.max(0,S.progress-4);i<=end;i++){const d=dist(S.gps,S.coords[i]);if(d<bestD){bestD=d;best=i}}
 if(best>=S.progress-2)S.progress=Math.max(S.progress,best);
 const done=S.coords.slice(0,S.progress+1),left=S.coords.slice(S.progress);
 if(done.length>1){
  if(!S.completedLine)S.completedLine=L.polyline(done,{color:"#9299a3",weight:6,opacity:.85}).addTo(map);
  else S.completedLine.setLatLngs(done);
 }
 if(left.length>1&&S.routeLine)S.routeLine.setLatLngs(left);
}
function drawRoutes(){
 clearLines();
 const chosen=S.routes[S.routeIndex];
 S.coords=chosen.geometry.coordinates.map(p=>[p[1],p[0]]);
 S.routeLine=L.polyline(S.coords,{color:"#2878f0",weight:6,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
 S.routes.forEach((r,i)=>{
  if(i===S.routeIndex)return;
  const pts=r.geometry.coordinates.map(p=>[p[1],p[0]]);
  S.alternativeLines.push(L.polyline(pts,{color:"#929ba8",weight:5,opacity:.7,dashArray:"8 9"}).addTo(map));
 });
 if(S.destinationMarker)map.removeLayer(S.destinationMarker);
 S.destinationMarker=L.marker([S.destination.lat,S.destination.lon]).addTo(map).bindPopup("Destination");
 const bounds=L.latLngBounds(S.coords.map(routePoint));
 map.fitBounds(bounds,{paddingTopLeft:[340,150],paddingBottomRight:[80,110],maxZoom:16});
 if(S.following&&S.gps)map.setView(S.gps,17);
 updateProgress();
}
function makeCarIcon(){
 return L.divIcon({
  className:"carMarker",
  html:'<div class="carRotate"><div class="carNose"></div><div class="carBody"></div><div class="carGlass"></div><div class="carLight"></div></div>',
  iconSize:[34,44],iconAnchor:[17,22]
 });
}
function setCar(p){
 if(!S.marker)S.marker=L.marker(p,{icon:makeCarIcon(),interactive:false,zIndexOffset:1000}).addTo(map);
 else S.marker.setLatLng(p);
 const el=S.marker.getElement();
 const rotator=el?.querySelector(".carRotate");
 if(rotator)rotator.style.transform="rotate("+S.heading+"deg)";
}
function animate(){
 if(S.target){
  if(!S.display)S.display=S.target.slice();
  const elapsed=Math.max(0,Math.min(1.25,(performance.now()-S.predictionAt)/1000));
  const speed=S.speed&&S.speed>1.5&&S.accuracy<45?Math.min(S.speed,45):0;
  const predicted=speed?predictPoint(S.target,S.heading,speed*elapsed):S.target;
  const frameDelta=Math.min(.12,Math.max(.008,(performance.now()-(S.lastFrameAt||performance.now()))/1000));
  S.lastFrameAt=performance.now();
  const blend=1-Math.exp(-frameDelta*5.5);
  S.display[0]+=(predicted[0]-S.display[0])*blend;
  S.display[1]+=(predicted[1]-S.display[1])*blend;
  setCar(S.display);
  if(S.following){
   const zoom=Math.max(map.getZoom(),16);
   const projected=map.project(S.display,zoom).subtract([0,map.getSize().y*.22]);
   map.setView(map.unproject(projected,zoom),zoom,{animate:false});
   if(S.headingUp)map.setBearing((360-S.heading)%360);
   else if(Math.abs(map.getBearing())>.1)map.setBearing(0);
  }
 }
 S.frame=requestAnimationFrame(animate);
}
S.frame=requestAnimationFrame(animate);

function gpsUpdate(pos){
 const c=pos.coords,p=[c.latitude,c.longitude],now=performance.now();
 S.accuracy=c.accuracy||999;
 if(S.lastFix){
  const meters=dist(S.lastFix,p),dt=Math.max(.2,(now-S.lastFixAt)/1000);
  if(Number.isFinite(c.heading)&&c.heading>=0&&c.speed>1.2)S.heading=smoothAngle(S.heading,c.heading,.38);
  else if(meters>3&&dt<12)S.heading=smoothAngle(S.heading,bearing(S.lastFix,p),.32);
  const measured=Number.isFinite(c.speed)&&c.speed>=0?c.speed:meters/dt;
  if(measured<60)S.speed=S.speed===null?measured:S.speed*.65+measured*.35;
 }
 S.lastFix=p;S.lastFixAt=now;S.predictionAt=performance.now();S.gps=p;S.target=p;
 $("origin").value="My current location";S.origin={lat:p[0],lon:p[1],label:"Your location"};
 $("speedValue").textContent=S.speed===null?"--":Math.round(S.speed*2.236936);\n if(Date.now()-S.lastLimitQuery>10000)updateSpeedLimit(p);
 if(S.live){updateProgress();updateNavInfo();updateNextTurn();checkOffRoute()}
}
function startGPS(){
 if(!navigator.geolocation){status("This browser does not support location.",true);return}
 if(S.watch!==null)return;
 status("Waiting for GPS location...");
 S.watch=navigator.geolocation.watchPosition(gpsUpdate,e=>status(e.code===1?"Location permission denied.":"Could not get GPS location.",true),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
function waitGPS(){return new Promise((resolve,reject)=>{const t=Date.now();const check=()=>S.gps?resolve():Date.now()-t>16000?reject(new Error("Could not get GPS location.")):setTimeout(check,200);check()})}
$("gpsBtn").onclick=()=>{startGPS();S.following=true};
$("recenterBtn").onclick=()=>{if(!S.gps){startGPS();return}S.following=true;map.setView(S.gps,17);if(S.headingUp)map.setBearing((360-S.heading)%360)};
$("compassBtn").onclick=()=>{
 S.headingUp=!S.headingUp;
 $("compassBtn").classList.toggle("active",S.headingUp);
 if(!S.headingUp)map.setBearing(0);
 else if(S.gps)map.setBearing((360-S.heading)%360);
};
$("themeBtn").onclick=()=>{
 S.dark=!S.dark;
 map.getPane("tilePane").classList.toggle("dark-tiles",S.dark);
 $("themeBtn").textContent=S.dark?"☀":"☾";
};
$("zoomInBtn").onclick=()=>map.zoomIn();
$("zoomOutBtn").onclick=()=>map.zoomOut();
map.on("dragstart",()=>S.following=false);

async function geocode(q,signal){
 const r=await fetch(GEOCODER+"?format=jsonv2&limit=6&q="+encodeURIComponent(q),{signal,headers:{"Accept-Language":"en"}});
 if(!r.ok)throw new Error("Place search unavailable");
 return (await r.json()).map(x=>({lat:+x.lat,lon:+x.lon,label:x.display_name}));
}
function setupAutocomplete(inputId,boxId,kind){
 const input=$(inputId),box=$(boxId);let timer;
 input.addEventListener("input",()=>{
  clearTimeout(timer);S.searchControllers[kind]?.abort();
  const q=input.value.trim();if(kind==="origin")S.origin=null;else S.destination=null;
  if(q.length<3){box.classList.remove("show");return}
  const seq=S.searchSequence[kind]=(S.searchSequence[kind]||0)+1;
  timer=setTimeout(async()=>{
   const controller=new AbortController();S.searchControllers[kind]=controller;
   try{
    const results=await geocode(q,controller.signal);if(S.searchSequence[kind]!==seq)return;
    box.innerHTML="";
    results.forEach(place=>{const el=document.createElement("div");el.className="suggestion";el.textContent=place.label;el.onclick=()=>{input.value=place.label;box.classList.remove("show");if(kind==="origin")S.origin=place;else S.destination=place};box.appendChild(el)});
    box.classList.toggle("show",results.length>0);
   }catch(e){if(e.name!=="AbortError")box.classList.remove("show")}
  },350);
 });
 input.addEventListener("keydown",e=>{if(e.key==="Enter")navigate()});
}
setupAutocomplete("origin","originSuggest","origin");setupAutocomplete("dest","destSuggest","destination");
document.addEventListener("click",e=>{if(!e.target.closest("#origin,#originSuggest"))$("originSuggest").classList.remove("show");if(!e.target.closest("#dest,#destSuggest"))$("destSuggest").classList.remove("show")});
async function resolveOrigin(){
 if($("origin").value.trim()==="My current location"||!$("origin").value.trim()){startGPS();if(!S.gps)await waitGPS();return {lat:S.gps[0],lon:S.gps[1],label:"Your location"}}
 return S.origin||((await geocode($("origin").value.trim()))[0]);
}
async function resolveDestination(){if(S.destination)return S.destination;const r=await geocode($("dest").value.trim());if(!r.length)throw new Error("Destination not found.");return S.destination=r[0]}
async function getRoutes(a,b,quick=false){
 const url=ROUTER+"/route/v1/driving/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=full&geometries=geojson&steps=true&alternatives="+(quick?"false":"true");
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),quick?7500:15000);
 try{
  const r=await fetch(url,{signal:controller.signal});
  if(!r.ok)throw new Error("Routing service unavailable.");
  const d=await r.json();if(d.code!=="Ok"||!d.routes?.length)throw new Error("No route found.");
  return d.routes;
 }catch(e){if(e.name==="AbortError")throw new Error("Route calculation timed out. Please try again.");throw e}
 finally{clearTimeout(timer)}
}
async function updateSpeedLimit(position){
 if(!position||!S.live)return;
 S.lastLimitQuery=Date.now();
 S.limitController?.abort();
 const controller=new AbortController();S.limitController=controller;
 const timer=setTimeout(()=>controller.abort(),7000);
 try{
  const q='[out:json][timeout:8];way(around:35,'+position[0]+','+position[1]+')[highway][maxspeed];out tags geom;';
  const response=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q),signal:controller.signal});
  if(!response.ok)throw new Error("Speed limit data unavailable");
  const data=await response.json();
  let best=null,bestDistance=Infinity;
  for(const way of data.elements||[]){
   const raw=way.tags?.maxspeed;if(!raw||!Array.isArray(way.geometry))continue;
   const value=String(raw).split(";")[0].trim().toLowerCase();
   const match=value.match(/^(\\d+(?:\\.\\d+)?)\\s*(mph|km\\/?h|kph)?$/);
   if(!match)continue;
   let mph=Number(match[1]);if(!match[2]||match[2].startsWith("km")||match[2]==="kph")mph*=0.621371;
   if(!Number.isFinite(mph)||mph<=0||mph>150)continue;
   for(const point of way.geometry){
    const d=dist(position,[point.lat,point.lon]);
    if(d<bestDistance){bestDistance=d;best=Math.round(mph)}
   }
  }
  if(!controller.signal.aborted){
   $("limitValue").textContent=best!==null&&bestDistance<=45?best:"--";
   $("limitUnit").textContent=best!==null&&bestDistance<=45?"mph · OSM speed limit":"mph · limit unavailable";
  }
 }catch(e){
  if(e.name!=="AbortError"){$("limitValue").textContent="--";$("limitUnit").textContent="mph · limit unavailable"}
 }finally{clearTimeout(timer)}
}
function stepsFor(route){return (route.legs||[]).flatMap(l=>l.steps||[])}
function maneuver(s){
 const m=s?.maneuver||{},t=m.type||"",d=m.modifier||"";
 if(t==="arrive")return ["●","You have arrived"];
 if(t==="depart")return ["↑","Start driving"];
 if(t==="uturn")return ["⟲","Make a U-turn"];
 if(t==="roundabout")return ["⟳","Take the roundabout"];
 if(d.includes("left"))return ["↰",t==="merge"?"Merge left":"Turn left"];
 if(d.includes("right"))return ["↱",t==="merge"?"Merge right":"Turn right"];
 if(t==="merge")return ["↑","Merge"];
 if(t==="fork")return ["⑂","At the fork"];
 if(t==="on ramp")return ["↗","Take the ramp"];
 if(t==="off ramp")return ["↗","Take the exit"];
 return ["↑","Continue straight"];
}
function routeRank(mode){
 const indexes=S.routes.map((r,i)=>({r,i}));
 if(mode==="shortest")indexes.sort((a,b)=>a.r.distance-b.r.distance);
 else if(mode==="fewest")indexes.sort((a,b)=>turnCount(a.r)-turnCount(b.r)||a.r.duration-b.r.duration);
 else indexes.sort((a,b)=>a.r.duration-b.r.duration);
 return indexes[0]?.i??0;
}
function turnCount(route){
 return stepsFor(route).filter(s=>{
  const t=s.maneuver?.type||"",m=s.maneuver?.modifier||"";
  return !["depart","arrive","continue","new name"].includes(t)&&
   (["turn","uturn","roundabout","rotary","fork","merge","on ramp","off ramp","exit roundabout"].includes(t)||m!=="straight");
 }).length;
}
function selectRouteMode(mode){
 S.routeMode=mode;S.routeIndex=routeRank(mode);S.route=S.routes[S.routeIndex];
 S.steps=stepsFor(S.route);S.stepIndex=0;S.progress=0;S.spokenStep=-1;
 drawRoutes();renderRouteChoices();renderDirections();updateNavInfo();updateNextTurn();
}
function renderRouteChoices(){
 const box=$("routeChoices");box.innerHTML="";
 if(!S.routes.length)return;
 const modes=[["fastest","Fastest"],["shortest","Shortest"],["fewest","Fewer turns"]];
 modes.forEach(([mode,label])=>{
  const i=routeRank(mode),r=S.routes[i],el=document.createElement("div");
  el.className="routeChoice"+(mode===S.routeMode?" selected":"");
  const metric=mode==="fewest"?turnCount(r)+" turns":mode==="shortest"?distText(r.distance):timeText(r.duration);
  const detail=mode==="fewest"?timeText(r.duration):mode==="shortest"?timeText(r.duration):distText(r.distance);
  el.innerHTML="<b>"+label+(S.routes.length===1?" · only route available":"")+"</b><div>"+metric+" · "+detail+"</div>";
  el.onclick=()=>selectRouteMode(mode);
  box.appendChild(el);
 });
}
function renderDirections(){
 const box=$("directionsContent");box.innerHTML="";
 S.steps.forEach(s=>{const [ico,label]=maneuver(s),el=document.createElement("div");el.className="step";const a=document.createElement("div");a.className="stepIcon";a.textContent=ico;const b=document.createElement("div"),strong=document.createElement("b"),small=document.createElement("div");strong.textContent=label+(s.name?" onto "+s.name:"");small.className="muted";small.textContent=distText(s.distance||0)+" · "+timeText(s.duration||0);b.append(strong,small);el.append(a,b);box.appendChild(el)});
}
function updateStep(){
 if(!S.steps.length||!S.gps)return;
 for(let i=S.stepIndex;i<S.steps.length;i++){
  const loc=S.steps[i].maneuver?.location;if(!loc)continue;
  const d=dist(S.gps,[loc[1],loc[0]]);
  if(d>18||S.steps[i].maneuver.type==="arrive"){S.stepIndex=i;break}
  S.stepIndex=Math.min(i+1,S.steps.length-1);
 }
}
function updateNextTurn(){
 if(!S.live||!S.gps||!S.steps.length)return;
 updateStep();const s=S.steps[S.stepIndex];if(!s)return;
 const loc=s.maneuver?.location,d=loc?dist(S.gps,[loc[1],loc[0]]):s.distance||0,[ico,label]=maneuver(s);
 $("turnIcon").textContent=ico;$("turnDistance").textContent=s.maneuver?.type==="arrive"?"Destination":distText(d);$("turnType").textContent=label;$("turnRoad").textContent=s.name?"onto "+s.name:"";$("nextTurn").style.display="block";
 if(S.voice&&S.spokenStep!==S.stepIndex&&d<120){S.spokenStep=S.stepIndex;if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(label+(s.name?" onto "+s.name:"")))}}
}
function updateNavInfo(){
 if(!S.route)return;
 let remaining=S.route.duration,meters=S.route.distance;
 if(S.gps&&S.coords.length){let left=0;for(let i=S.progress;i<S.coords.length-1;i++)left+=dist(S.coords[i],S.coords[i+1]);meters=left;remaining=S.route.duration*left/Math.max(1,S.route.distance)}
 $("etaValue").textContent=new Date(Date.now()+remaining*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});$("timeValue").textContent=timeText(remaining);$("distanceValue").textContent=distText(meters);
}
function saveHistory(a,b){
 S.history=[{from:a.label,to:b.label,lat:b.lat,lon:b.lon,time:Date.now()},...S.history.filter(x=>x.to!==b.label)].slice(0,20);
 localStorage.setItem("horizonmaps_history",JSON.stringify(S.history));
}
async function navigate(){
 const dest=$("dest").value.trim();if(!dest){status("Enter a destination.",true);return}
 $("routeBtn").disabled=true;status("Finding route...");
 try{
  const a=await resolveOrigin(),b=await resolveDestination();S.origin=a;S.destination=b;
  S.routes=await getRoutes(a,b);S.routeMode="fastest";S.routeIndex=routeRank("fastest");S.route=S.routes[S.routeIndex];S.steps=stepsFor(S.route);S.stepIndex=0;S.progress=0;S.spokenStep=-1;
  S.live=$("origin").value.trim()==="My current location"||!!S.gps;
  if(S.live){startGPS();S.following=true}
  $("searchPanel").style.display="none";
  $("directionsCancel").style.display="none";
  $("directions").style.display="none";
  drawRoutes();renderRouteChoices();renderDirections();updateNavInfo();
  $("navInfo").style.display="flex";$("stopBtn").style.display="inline-block";$("nextTurn").style.display=S.live?"block":"none";
  saveHistory(a,b);status("Route ready · "+S.routes.length+" option"+(S.routes.length===1?"":"s"));
  if(S.gps){updateProgress();updateNextTurn();S.following=S.live}
 }catch(e){status(e.message||"Could not create route.",true)}
 finally{$("routeBtn").disabled=false}
}
$("routeBtn").onclick=navigate;
function stopNavigation(){
 S.live=false;S.following=false;S.route=null;S.routes=[];S.steps=[];S.coords=[];S.progress=0;S.offRouteSince=0;
 $("searchPanel").style.display="";
 $("navInfo").style.display="none";$("nextTurn").style.display="none";$("stopBtn").style.display="none";
 clearLines();if(S.destinationMarker){map.removeLayer(S.destinationMarker);S.destinationMarker=null}
 if("speechSynthesis"in window)speechSynthesis.cancel();status("Navigation stopped.");
}
$("stopBtn").onclick=stopNavigation;

function checkOffRoute(){
 if(!S.live||!S.following||!S.gps||!S.coords.length||S.rerouting||S.accuracy>80)return;
 let nearest=Infinity;
 const start=Math.max(0,S.progress-8),end=Math.min(S.coords.length,S.progress+180);
 for(let i=start;i<end;i++)nearest=Math.min(nearest,dist(S.gps,S.coords[i]));
 const threshold=Math.max(38,S.accuracy*1.15);
 if(nearest>threshold){
  if(!S.offRouteSince)S.offRouteSince=Date.now();
  if(Date.now()-S.offRouteSince>2200&&Date.now()-S.lastReroute>5000)reroute();
 }else S.offRouteSince=0;
}
async function reroute(){
 if(!S.gps||!S.destination||S.rerouting)return;
 S.rerouting=true;S.lastReroute=Date.now();S.offRouteSince=0;status("Off route · quickly recalculating...");
 try{
  const fresh=await getRoutes({lat:S.gps[0],lon:S.gps[1]},S.destination,true);
  S.routes=fresh;S.routeMode="fastest";S.routeIndex=routeRank("fastest");S.route=fresh[S.routeIndex];S.steps=stepsFor(S.route);S.stepIndex=0;S.progress=0;S.spokenStep=-1;
  drawRoutes();renderRouteChoices();renderDirections();updateNavInfo();status("Route updated.");
 }catch(e){status(e.message||"Could not recalculate route.",true)}finally{S.rerouting=false}
}

function loadStored(){
 try{S.history=JSON.parse(localStorage.getItem("horizonmaps_history")||"[]")}catch{}
 try{S.saved=JSON.parse(localStorage.getItem("horizonmaps_saved")||"[]")}catch{}
}
function showHistory(){
 const box=$("historyContent");box.innerHTML="";
 if(!S.history.length){box.textContent="No recent routes yet.";return}
 S.history.forEach(h=>{
  const el=document.createElement("div");el.className="historyItem";const text=document.createElement("div"),b=document.createElement("b"),small=document.createElement("div"),btn=document.createElement("button");
  b.textContent=h.to;small.className="muted";small.textContent="From "+h.from+" · "+new Date(h.time).toLocaleDateString();btn.className="btn";btn.textContent="Route";
  btn.onclick=()=>{$("dest").value=h.to;S.destination={lat:h.lat,lon:h.lon,label:h.to};$("history").style.display="none";navigate()};
  text.append(b,small);el.append(text,btn);box.append(el);
 });
 const clear=document.createElement("button");clear.className="btn danger";clear.textContent="Clear history";clear.onclick=()=>{S.history=[];localStorage.removeItem("horizonmaps_history");showHistory()};box.append(clear);
}
function showSaved(){
 const box=$("placesContent");box.innerHTML="";
 if(!S.saved.length){box.textContent="No saved places yet. Choose a destination and tap Save.";return}
 S.saved.forEach(p=>{
  const el=document.createElement("div");el.className="placeItem";const name=document.createElement("b");name.textContent=p.label;
  const go=document.createElement("button");go.className="btn";go.textContent="Route";go.onclick=()=>{$("dest").value=p.label;S.destination=p;$("places").style.display="none";navigate()};
  const del=document.createElement("button");del.className="btn";del.textContent="Remove";del.onclick=()=>{S.saved=S.saved.filter(x=>x.label!==p.label);localStorage.setItem("horizonmaps_saved",JSON.stringify(S.saved));showSaved()};
  el.append(name,go,del);box.append(el);
 });
}
$("saveBtn").onclick=()=>{if(!S.destination){status("Find a destination first.",true);return}if(!S.saved.some(x=>x.label===S.destination.label))S.saved.push(S.destination);localStorage.setItem("horizonmaps_saved",JSON.stringify(S.saved));status("Place saved on this device.")};
$("savedBtn").onclick=()=>{$("places").style.display="block";showSaved()};
$("historyBtn").onclick=()=>{$("history").style.display="block";showHistory()};
function closeDirections(){
 $("directions").style.display="none";
 $("searchPanel").style.display="";
 $("directionsCancel").style.display="none";
}
$("routesBtn").onclick=()=>{$("routeOptions").style.display="block";renderRouteChoices()};
$("directionsBtn").onclick=()=>{
 if($("directions").style.display==="block"){closeDirections();return}
 $("searchPanel").style.display="none";
 $("directions").style.display="block";
 $("directionsCancel").style.display="block";
 renderDirections();
};
$("directionsCancel").onclick=closeDirections;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{const id=b.dataset.close;$(id).style.display="none";if(id==="directions")closeDirections()});
$("collapseBtn").onclick=()=>{$("searchPanel").classList.toggle("collapsed");$("collapseBtn").textContent=$("searchPanel").classList.contains("collapsed")?"+":"−"};

$("voiceBtn").onclick=()=>{S.voice=!S.voice;$("voiceBtn").textContent=S.voice?"🔊 Voice on":"🔇 Voice off";if(!S.voice&&"speechSynthesis"in window)speechSynthesis.cancel()};
$("trafficBtn").onclick=()=>alert("Live traffic is not supplied by standard OpenStreetMap map tiles or OSRM. This version does not invent traffic conditions; a regional public feed or a traffic provider integration is required.");
async function nearby(){
 $("places").style.display="block";$("placesContent").textContent="Searching nearby places...";
 const c=S.gps||[map.getCenter().lat,map.getCenter().lng];
 const q='[out:json][timeout:20];(node(around:1200,'+c[0]+','+c[1]+')[amenity];node(around:1200,'+c[0]+','+c[1]+')[shop];node(around:1200,'+c[0]+','+c[1]+')[tourism];);out 30;';
 try{
  const r=await fetch(OVERPASS,{method:"POST",body:"data="+encodeURIComponent(q)});if(!r.ok)throw Error();
  const data=await r.json(),box=$("placesContent");box.innerHTML="";
  (data.elements||[]).forEach(p=>{
   const t=p.tags||{},name=t.name||t.amenity||t.shop||t.tourism||"Place",lat=p.lat,lon=p.lon;if(!lat||!lon)return;
   const el=document.createElement("div");el.className="placeItem";const info=document.createElement("div"),b=document.createElement("b"),small=document.createElement("div"),btn=document.createElement("button");
   b.textContent=name;small.className="muted";small.textContent=[t.amenity,t.shop,t.tourism].filter(Boolean).join(" · ");btn.className="btn";btn.textContent="Show";btn.onclick=()=>map.flyTo([lat,lon],17);
   info.append(b,small);el.append(info,btn);box.append(el);
  });
  if(!box.children.length)box.textContent="No nearby places found.";
 }catch(e){$("placesContent").textContent="Nearby search is temporarily unavailable."}
}
$("nearbyBtn").onclick=nearby;
loadStored();
setInterval(()=>{if(S.live){updateNavInfo();updateNextTurn()}},2500);
window.addEventListener("beforeunload",()=>{if(S.watch!==null)navigator.geolocation.clearWatch(S.watch);cancelAnimationFrame(S.frame);if("speechSynthesis"in window)speechSynthesis.cancel()});
</script>
